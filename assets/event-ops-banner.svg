<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Event Operations Hub</title>
  <desc id="desc">A dark technical banner for an event operations coordination dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111d32"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#56d6ff"/><stop offset="1" stop-color="#8b7cff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8da7ce" stroke-opacity=".10" stroke-width="1"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="920" cy="130" r="110" fill="#4169e1" opacity=".18" filter="url(#soft)"/>
  <circle cx="1030" cy="300" r="95" fill="#36d6c5" opacity=".13" filter="url(#soft)"/>
  <g stroke="url(#glow)" stroke-width="2" fill="none" opacity=".9">
    <path d="M820 95H930V155H1010"/><path d="M820 210H900V270H1040"/><path d="M930 155V225H990"/><path d="M900 270H860V320H970"/>
  </g>
  <g fill="#111d32" stroke="#6bdcff" stroke-width="2">
    <rect x="785" y="73" width="70" height="44" rx="10"/><rect x="930" y="135" width="80" height="42" rx="10"/>
    <rect x="790" y="188" width="62" height="44" rx="10"/><rect x="990" y="205" width="82" height="42" rx="10"/>
    <rect x="970" y="299" width="74" height="42" rx="10"/>
  </g>
  <g fill="#a6f0ff"><circle cx="820" cy="95" r="5"/><circle cx="950" cy="156" r="5"/><circle cx="820" cy="210" r="5"/><circle cx="1010" cy="226" r="5"/><circle cx="1007" cy="320" r="5"/></g>
  <g font-family="'Roboto Mono', monospace" fill="#9bb0ce" font-size="13" letter-spacing="2"><text x="72" y="78">SURAj7ai / PROJECT LAB</text><text x="72" y="354">OPERATIONS  •  COORDINATION  •  SYSTEMS THINKING</text></g>
  <text x="68" y="166" font-family="'Arial', sans-serif" font-size="51" font-weight="700" fill="#f7faff" letter-spacing="-1">EVENT OPERATIONS</text>
  <text x="68" y="224" font-family="'Arial', sans-serif" font-size="51" font-weight="700" fill="url(#glow)" letter-spacing="-1">HUB</text>
  <text x="72" y="270" font-family="'Arial', sans-serif" font-size="20" fill="#c5d2e6">A command center for the moving parts behind an event.</text>
  <rect x="72" y="298" width="190" height="3" rx="1.5" fill="url(#glow)"/>
  <g font-family="'Roboto Mono', monospace" font-size="12" fill="#a7bdd9"><text x="785" y="48">LIVE SYSTEM MAP</text><text x="785" y="380">STATUS: INTERACTIVE DEMO</text></g>
</svg>